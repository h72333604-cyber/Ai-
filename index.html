    <script>
      (function() {
        // 1. Intercept console.error to filter out HMR WebSocket messages as per environment rules
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (arg && (arg.message || arg.stack || String(arg))) || '';
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1 || (arguments[0] === '[vite]' && str.indexOf('WebSocket') !== -1)) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };

        // 2. Window error event suppression for HMR
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1 || e.message.indexOf('closed without opened') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1 || reason.indexOf('closed without opened') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });

        // 3. Stub Vite HMR WebSocket so @vite/client successfully connects without error
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHMR = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) || (typeof url === 'string' && url.indexOf('vite-hmr') !== -1);
            if (isViteHMR) {
              var dummy = new EventTarget();
              dummy.url = url;
              dummy.readyState = 1; // WebSocket.OPEN
              dummy.CONNECTING = 0;
              dummy.OPEN = 1;
              dummy.CLOSING = 2;
              dummy.CLOSED = 3;
              dummy.binaryType = 'blob';
              dummy.bufferedAmount = 0;
              dummy.extensions = '';
              dummy.protocol = 'vite-hmr';
              dummy.send = function() {};
              dummy.close = function() {
                dummy.readyState = 3;
                dummy.dispatchEvent(new Event('close'));
              };
              setTimeout(function() {
                dummy.dispatchEvent(new Event('open'));
              }, 20);
              return dummy;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
